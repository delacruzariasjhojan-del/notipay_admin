<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NotiPay · Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--petroleo:#123B50;--verde:#18B978;--verde-osc:#0F8F5C;--fondo:#F4F7F8;--texto:#17212B;--rojo:#D32F2F;--ambar:#E0A100;--azul:#1E6FB8;--gris:#6B7885;--borde:#E3E9EC;--sombra:0 4px 18px rgba(18,59,80,.09)}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,sans-serif;background:var(--petroleo);color:var(--texto);min-height:100vh}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;border:0}
input{font:inherit}
header{position:relative;overflow:hidden;background:var(--petroleo);color:#fff;padding:22px 18px 58px}
header::before,header::after{content:"";position:absolute;border-radius:50%;background:rgba(24,185,120,.18)}
header::before{width:180px;height:180px;right:-50px;top:-70px}
header::after{width:110px;height:110px;left:-30px;bottom:-50px;background:rgba(255,255,255,.07)}
.cab{position:relative;z-index:1;max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.cab h1{font-size:1.2rem}
.cab .acc{display:flex;gap:8px}
.hoja{position:relative;margin-top:-30px;background:var(--fondo);border-radius:28px 28px 0 0;min-height:70vh;padding:20px 16px 40px}
.wrap{max-width:1100px;margin:auto}
.btn{padding:10px 16px;border-radius:12px;font-weight:600;font-size:.88rem;transition:.15s}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.6;cursor:wait}
.b-pet{background:var(--petroleo);color:#fff}
.b-ver{background:linear-gradient(135deg,var(--verde),var(--verde-osc));color:#fff}
.b-rojo{background:#fdecec;color:var(--rojo)}
.b-claro{background:rgba(255,255,255,.14);color:#fff}
.b-gris{background:#e9eef0;color:var(--texto)}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{padding:9px 16px;border-radius:999px;background:#e9eef0;color:var(--petroleo);font-weight:600;font-size:.88rem}
.tab.on{background:var(--petroleo);color:#fff}
.resumen{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(min-width:700px){.resumen{grid-template-columns:repeat(5,1fr)}}
.stat{background:#fff;border-radius:16px;box-shadow:var(--sombra);padding:14px;text-align:left;border:2px solid transparent;color:var(--texto)}
.stat.on{border-color:var(--verde)}
.stat b{display:block;font-size:1.7rem;color:var(--petroleo)}
.stat span{font-size:.78rem;color:var(--gris);font-weight:500}
.barra{display:flex;gap:10px;margin-bottom:16px}
.barra input{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--borde);border-radius:14px;background:#fff}
.grilla{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:720px){.grilla{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1040px){.grilla{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;background:#fff;border-radius:18px;box-shadow:var(--sombra);padding:16px;border:2px solid transparent}
.card.nuevo{border-color:var(--ambar)}
.insignia{position:absolute;top:-10px;right:14px;background:var(--ambar);color:#fff;font-size:.68rem;font-weight:700;padding:3px 10px;border-radius:999px}
.fila{display:flex;gap:12px;align-items:center}
.foto{position:relative;flex:none;width:54px;height:54px;border-radius:50%;background:var(--petroleo);color:#fff;display:grid;place-items:center;font-weight:700;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover}
.punto{position:absolute;right:-1px;bottom:-1px;width:14px;height:14px;border-radius:50%;background:var(--verde);border:2px solid #fff}
.nombre{font-weight:700;color:var(--petroleo);overflow-wrap:anywhere}
.nombre.vacio{color:#9aa5ad;font-weight:600}
.sub{font-size:.82rem;color:var(--gris);overflow-wrap:anywhere}
.datos{margin:12px 0;font-size:.82rem;display:grid;gap:4px}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:700;color:#fff;margin-top:4px}
.t-pendiente{background:var(--ambar)}.t-prueba{background:var(--azul)}.t-activo{background:var(--verde)}.t-bloqueado{background:var(--rojo)}
.acciones{display:flex;flex-wrap:wrap;gap:8px}
.acciones .btn{padding:8px 12px;font-size:.8rem}
.vacio-box{text-align:center;color:var(--gris);padding:50px 10px;background:#fff;border-radius:18px;box-shadow:var(--sombra)}
.sk{height:190px;border-radius:18px;background:linear-gradient(90deg,#e9eef0,#f6f9fa,#e9eef0);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
/* Login */
.login{max-width:380px;margin:40px auto;background:#fff;border-radius:20px;box-shadow:var(--sombra);padding:26px}
.login h2{color:var(--petroleo);margin-bottom:16px}
label{display:block;font-size:.82rem;font-weight:600;margin:12px 0 5px}
.campo{width:100%;padding:11px 13px;border:1px solid var(--borde);border-radius:12px}
.campo:focus,.barra input:focus{outline:2px solid var(--verde);border-color:transparent}
.pwbox{position:relative}
.pwbox .campo{padding-right:46px}
.ojo{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;padding:8px 10px;font-size:1.1rem;line-height:1;border-radius:10px}
.ojo:hover{background:#eef2f3}
.ojo svg{display:block;width:24px;height:24px;color:#33383d}
.err{color:var(--rojo);font-size:.84rem;margin-top:10px}
/* Modal y toast */
.overlay{position:fixed;inset:0;background:rgba(18,59,80,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:20px;padding:22px;width:100%;max-width:420px;max-height:92vh;overflow:auto}
.modal h3{color:var(--petroleo);margin-bottom:6px}
.modal .pie{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.prev{width:80px;height:80px;margin:8px 0}
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;display:grid;gap:8px;width:min(92vw,360px)}
.toast{padding:12px 16px;border-radius:12px;color:#fff;font-size:.88rem;font-weight:500;box-shadow:var(--sombra)}
.toast.ok{background:var(--verde-osc)}.toast.mal{background:var(--rojo)}
</style>
</head>
<body>
<header>
  <div class="cab">
    <h1>NotiPay · Panel</h1>
    <div class="acc" id="acc" hidden>
      <button class="btn b-claro" id="btnAct">Actualizar</button>
      <button class="btn b-claro" id="btnSalir">Cerrar sesión</button>
    </div>
  </div>
</header>

<main class="hoja"><div class="wrap">
  <!-- Login -->
  <form class="login" id="login" hidden>
    <h2>Iniciar sesión</h2>
    <label for="em">Correo</label><input class="campo" id="em" type="email" autocomplete="username" required>
    <label for="pw">Contraseña</label>
    <div class="pwbox">
      <input class="campo" id="pw" type="password" autocomplete="current-password" required>
      <button type="button" class="ojo" id="ojo" aria-label="Mostrar contraseña" title="Mostrar contraseña"></button>
    </div>
    <p class="err" id="loginErr" hidden></p>
    <button class="btn b-ver" id="btnLogin" style="width:100%;margin-top:18px">Entrar</button>
  </form>

  <!-- Panel -->
  <section id="panel" hidden>
    <div class="tabs">
      <button class="tab on" data-tab="cel">Celulares</button>
      <button class="tab" data-tab="rep">Reportes</button>
    </div>
    <div id="vCel">
      <div class="resumen" id="resumen"></div>
      <div class="barra"><input id="buscar" type="search" placeholder="Buscar por negocio, propietario, modelo o teléfono"></div>
      <div class="grilla" id="lista"></div>
    </div>
    <div id="vRep" hidden><div class="vacio-box">Próximamente: reportes de pagos por negocio</div></div>
  </section>
</div></main>
<div id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ===== Configuración (reemplaza estos valores) =====
const SUPABASE_URL = 'https://piupyiuuncmsuzgepzae.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_NzWDUpyOCm37sXV2nk2szA_RF_UMDlG';

const CONFIGURADO = /^https?:\/\//.test(SUPABASE_URL) && !SUPABASE_ANON_KEY.startsWith('PEGAR');
const sb = CONFIGURADO ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } }) : null;
const $ = id => document.getElementById(id);
const ESTADOS = [['todos','Total'],['pendiente','Pendientes'],['prueba','En prueba'],['activo','Activos'],['bloqueado','Bloqueados']];
const ETQ = { pendiente:'Pendiente', prueba:'En prueba', activo:'Activo', bloqueado:'Bloqueado' };
let datos = [], filtro = 'todos', cargando = false, timer = null, canal = null;

// ===== Utilidades =====
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg, ok = true) {
  const t = document.createElement('div');
  t.className = 'toast ' + (ok ? 'ok' : 'mal'); t.textContent = msg;
  $('toasts').appendChild(t); setTimeout(() => t.remove(), 4000);
}
function hace(f) {
  if (!f) return 'nunca';
  const s = Math.max(0, (Date.now() - new Date(f)) / 1000);
  if (s < 60) return 'unos segundos';
  const u = [[60,'minuto','minutos'],[3600,'hora','horas'],[86400,'día','días'],[2592000,'mes','meses'],[31536000,'año','años']];
  let r = [1,'',''];
  for (const x of [[1,'',''],...u]) if (s >= x[0]) r = x;
  const n = Math.floor(s / r[0]);
  if (r[0] === 1) return 'unos segundos';
  return n + ' ' + (n === 1 ? r[1] : r[2]);
}
const fecha = f => f ? new Date(f).toLocaleDateString('es-PE', { day:'2-digit', month:'short', year:'numeric' }) : '—';
function diasRestantes(d) {
  if (!d.prueba_inicio) return null;
  const fin = new Date(d.prueba_inicio).getTime() + (d.prueba_dias || 0) * 86400000;
  return Math.max(0, Math.ceil((fin - Date.now()) / 86400000));
}
// Plazo de activación: si la fecha de cierre pasó, el celular cuenta como bloqueado
const finActivo = d => d.activo_fin ? new Date(d.activo_fin).getTime() : null;
const activoVencido = d => d.estado === 'activo' && finActivo(d) !== null && finActivo(d) < Date.now();
const estadoEf = d => activoVencido(d) ? 'bloqueado' : d.estado;
const isoLocal = x => x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
const iniciales = n => (n || '').trim().split(/\s+/).slice(0,2).map(p => p[0]).join('').toUpperCase();
const msgErr = e => (e && /fetch|network/i.test(e.message || '')) ? 'Error de conexión. Revisa tu internet.' : (e?.message || 'Ocurrió un error inesperado.');

// ===== Modal genérico =====
function modal(html, onListo) {
  return new Promise(res => {
    const o = document.createElement('div'); o.className = 'overlay';
    o.innerHTML = '<div class="modal">' + html + '</div>';
    document.body.appendChild(o);
    const cerrar = v => { o.remove(); res(v); };
    o.addEventListener('mousedown', e => { if (e.target === o) cerrar(null); });
    o.querySelectorAll('[data-x]').forEach(b => b.onclick = () => cerrar(null));
    onListo && onListo(o, cerrar);
  });
}
const confirmar = (titulo, texto, si = 'Confirmar', peligro = false) => modal(
  `<h3>${esc(titulo)}</h3><p class="sub">${esc(texto)}</p><div class="pie"><button class="btn b-gris" data-x>Cancelar</button><button class="btn ${peligro ? 'b-rojo' : 'b-ver'}" id="mOk">${esc(si)}</button></div>`,
  (o, c) => o.querySelector('#mOk').onclick = () => c(true)).then(v => !!v);

// ===== Datos =====
async function cargar(silencioso) {
  if (cargando) return; cargando = true;
  if (!silencioso && !datos.length) $('lista').innerHTML = '<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  const { data, error } = await sb.from('dispositivos').select('*').order('creado', { ascending: false });
  cargando = false;
  if (error) { toast('No se pudo cargar la lista: ' + msgErr(error), false); if (!datos.length) $('lista').innerHTML = '<div class="vacio-box">No se pudo cargar la lista. Intenta con "Actualizar".</div>'; return; }
  datos = data || [];
  // Los activos con plazo vencido se bloquean también en la base de datos
  datos.filter(activoVencido).forEach(d => { d.estado = 'bloqueado'; sb.from('dispositivos').update({ estado: 'bloqueado' }).eq('id', d.id).then(() => {}); });
  pintar();
}
async function actualizar(id, cambios, okMsg) {
  const { error } = await sb.from('dispositivos').update(cambios).eq('id', id);
  if (error) { toast('Error: ' + msgErr(error), false); return false; }
  const d = datos.find(x => x.id === id); if (d) Object.assign(d, cambios);
  pintar(); toast(okMsg); return true;
}

// ===== Render =====
function pintar() {
  const cont = { todos: datos.length };
  ESTADOS.slice(1).forEach(([k]) => cont[k] = datos.filter(d => estadoEf(d) === k).length);
  $('resumen').innerHTML = ESTADOS.map(([k, n]) =>
    `<button class="stat ${filtro === k ? 'on' : ''}" data-f="${k}"><b>${cont[k]}</b><span>${n}</span></button>`).join('');

  const q = $('buscar').value.trim().toLowerCase();
  const l = datos.filter(d => (filtro === 'todos' || estadoEf(d) === filtro) &&
    (!q || [d.negocio, d.propietario, d.modelo, d.telefono].some(v => (v || '').toLowerCase().includes(q))));

  if (!l.length) {
    $('lista').innerHTML = `<div class="vacio-box" style="grid-column:1/-1">${datos.length ? 'No hay resultados con ese filtro o búsqueda.' : 'Aún no hay celulares registrados'}</div>`;
    return;
  }
  $('lista').innerHTML = l.map(d => {
    const reciente = d.ultima_conexion && Date.now() - new Date(d.ultima_conexion) < 86400000;
    const foto = d.foto_url ? `<img src="${esc(d.foto_url)}" alt="">` : esc(iniciales(d.negocio) || '📱');
    let prueba = '';
    if (d.estado === 'prueba') { const n = diasRestantes(d); prueba = `<div><b>${n === 0 ? 'Prueba vencida' : 'Quedan ' + n + (n === 1 ? ' día' : ' días')}</b></div>`; }
    const ef = estadoEf(d), fin = finActivo(d);
    if (fin && (ef === 'activo' || fin < Date.now())) {
      const n = Math.ceil((fin - Date.now()) / 86400000);
      prueba += fin < Date.now()
        ? `<div><b style="color:var(--rojo)">Plazo vencido el ${fecha(d.activo_fin)}</b></div>`
        : `<div><b>Activo del ${fecha(d.activo_inicio)} al ${fecha(d.activo_fin)} · Quedan ${n} ${n === 1 ? 'día' : 'días'}</b></div>`;
    }
    return `<article class="card ${d.estado === 'pendiente' ? 'nuevo' : ''}">
      ${d.estado === 'pendiente' ? '<span class="insignia">NUEVO</span>' : ''}
      <div class="fila"><div class="foto">${foto}${reciente ? '<i class="punto" title="Conectado en las últimas 24 h"></i>' : ''}</div>
        <div><div class="nombre ${d.negocio ? '' : 'vacio'}">${esc(d.negocio) || 'Sin asignar'}</div>
        <div class="sub">${esc(d.propietario) || 'Sin propietario'}${d.telefono ? ' · ' + esc(d.telefono) : ''}</div>
        <span class="tag t-${esc(ef)}">${esc(ETQ[ef] || ef)}</span></div></div>
      <div class="datos">
        <div>${esc(d.marca)} ${esc(d.modelo)} · Android ${esc(d.android)} · App v${esc(d.app_version)}</div>
        ${prueba}
        <div class="sub">Última conexión: hace ${hace(d.ultima_conexion)}</div>
        <div class="sub">Registrado: ${fecha(d.creado)}</div>
      </div>
      <div class="acciones" data-id="${esc(d.id)}">
        <button class="btn b-pet" data-a="prueba">Iniciar prueba</button>
        <button class="btn b-ver" data-a="activar">Activar</button>
        <button class="btn b-rojo" data-a="bloquear">Bloquear</button>
        <button class="btn b-gris" data-a="editar">Editar</button>
      </div></article>`;
  }).join('');
}

// ===== Acciones =====
async function iniciarPrueba(d) {
  const dias = await modal(`<h3>Iniciar prueba</h3><p class="sub">¿Cuántos días de prueba?</p>
    <input class="campo" id="mDias" type="number" min="1" max="365" value="${d.prueba_dias || 7}" style="margin-top:10px">
    <div class="pie"><button class="btn b-gris" data-x>Cancelar</button><button class="btn b-ver" id="mOk">Iniciar</button></div>`,
    (o, c) => o.querySelector('#mOk').onclick = () => {
      const n = parseInt(o.querySelector('#mDias').value, 10);
      if (!n || n < 1 || n > 365) return toast('Ingresa un número entre 1 y 365', false);
      c(n);
    });
  if (dias) actualizar(d.id, { estado: 'prueba', prueba_dias: dias, prueba_inicio: new Date().toISOString() }, 'Prueba iniciada por ' + dias + ' días');
}
// Activar: pide fecha de inicio y de cierre; al vencer, el celular se bloquea solo
async function activar(d) {
  const ini0 = d.activo_inicio ? isoLocal(new Date(d.activo_inicio)) : isoLocal(new Date());
  const fin0 = d.activo_fin && finActivo(d) > Date.now() ? isoLocal(new Date(d.activo_fin)) : isoLocal(new Date(Date.now() + 30 * 86400000));
  const r = await modal(`<h3>Activar celular</h3><p class="sub">Define el periodo. Al llegar la fecha de cierre el celular se bloqueará automáticamente.</p>
    <label for="mIni">Fecha de inicio</label><input class="campo" id="mIni" type="date" value="${ini0}">
    <label for="mFin">Fecha de cierre</label><input class="campo" id="mFin" type="date" value="${fin0}">
    <div class="pie"><button class="btn b-gris" data-x>Cancelar</button><button class="btn b-ver" id="mOk">Activar</button></div>`,
    (o, c) => o.querySelector('#mOk').onclick = () => {
      const i = o.querySelector('#mIni').value, f = o.querySelector('#mFin').value;
      if (!i || !f) return toast('Elige las dos fechas', false);
      if (f < i) return toast('La fecha de cierre debe ser posterior al inicio', false);
      const fin = new Date(f + 'T23:59:59');
      if (fin <= new Date()) return toast('La fecha de cierre ya pasó', false);
      c({ estado: 'activo', activo_inicio: new Date(i + 'T00:00:00').toISOString(), activo_fin: fin.toISOString() });
    });
  if (r) actualizar(d.id, r, 'Celular activado hasta el ' + fecha(r.activo_fin));
}
async function editar(d) {
  let archivo = null;
  await modal(`<h3>Editar celular</h3>
    <label>Foto del negocio</label>
    <div class="foto prev" id="mPrev">${d.foto_url ? `<img src="${esc(d.foto_url)}" alt="">` : esc(iniciales(d.negocio) || '📱')}</div>
    <input type="file" id="mFoto" accept="image/*">
    <label>Negocio</label><input class="campo" id="mNeg" value="${esc(d.negocio)}">
    <label>Propietario</label><input class="campo" id="mPro" value="${esc(d.propietario)}">
    <label>Teléfono</label><input class="campo" id="mTel" value="${esc(d.telefono)}" inputmode="tel">
    <div class="pie"><button class="btn b-gris" data-x>Cancelar</button><button class="btn b-ver" id="mOk">Guardar</button></div>`,
    (o, c) => {
      o.querySelector('#mFoto').onchange = e => {
        const f = e.target.files[0]; if (!f) return;
        if (!f.type.startsWith('image/')) { e.target.value = ''; return toast('El archivo debe ser una imagen', false); }
        if (f.size > 2 * 1024 * 1024) { e.target.value = ''; return toast('La imagen debe pesar menos de 2 MB', false); }
        archivo = f;
        const r = new FileReader();
        r.onload = () => { const p = o.querySelector('#mPrev'); p.innerHTML = ''; const im = new Image(); im.src = r.result; p.appendChild(im); };
        r.readAsDataURL(f);
      };
      o.querySelector('#mOk').onclick = async ev => {
        const b = ev.target; b.disabled = true; b.textContent = 'Guardando…';
        const cambios = { negocio: o.querySelector('#mNeg').value.trim(), propietario: o.querySelector('#mPro').value.trim(), telefono: o.querySelector('#mTel').value.trim() };
        if (archivo) {
          const ext = (archivo.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
          const ruta = d.id + '/' + Date.now() + '.' + ext;
          const { error } = await sb.storage.from('fotos').upload(ruta, archivo, { contentType: archivo.type, upsert: true });
          if (error) { toast('Error al subir la foto: ' + msgErr(error), false); b.disabled = false; b.textContent = 'Guardar'; return; }
          cambios.foto_url = sb.storage.from('fotos').getPublicUrl(ruta).data.publicUrl;
        }
        const ok = await actualizar(d.id, cambios, 'Cambios guardados');
        if (ok) c(true); else { b.disabled = false; b.textContent = 'Guardar'; }
      };
    });
}
$('lista').addEventListener('click', async e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const d = datos.find(x => x.id === b.parentElement.dataset.id); if (!d) return;
  const nom = d.negocio || 'este celular';
  if (b.dataset.a === 'prueba') iniciarPrueba(d);
  else if (b.dataset.a === 'editar') editar(d);
  else if (b.dataset.a === 'activar') activar(d);
  else if (b.dataset.a === 'bloquear' && await confirmar('Bloquear celular', '¿Seguro que quieres bloquear a ' + nom + '?', 'Bloquear', true))
    actualizar(d.id, { estado: 'bloqueado' }, 'Celular bloqueado');
});
$('resumen').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (b) { filtro = b.dataset.f; pintar(); } });
$('buscar').addEventListener('input', pintar);
$('btnAct').onclick = () => cargar(true).then(() => toast('Lista actualizada'));
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  $('vCel').hidden = t.dataset.tab !== 'cel'; $('vRep').hidden = t.dataset.tab !== 'rep';
});

// ===== Sesión =====
$('login').addEventListener('submit', async e => {
  e.preventDefault(); const b = $('btnLogin'); b.disabled = true; b.textContent = 'Entrando…'; $('loginErr').hidden = true;
  const { error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
  b.disabled = false; b.textContent = 'Entrar';
  if (error) { $('loginErr').textContent = /invalid/i.test(error.message) ? 'Correo o contraseña incorrectos.' : msgErr(error); $('loginErr').hidden = false; }
});
// Ojito: mostrar u ocultar la contraseña
const OJO = '<path d="M12 5C6.5 5 2.5 9.5 1.5 12c1 2.5 5 7 10.5 7s9.5-4.5 10.5-7C21.5 9.5 17.5 5 12 5z" fill="currentColor"/><circle cx="12" cy="12" r="3.6" fill="#fff"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/>';
const ICO_VER = '<svg viewBox="0 0 24 24" aria-hidden="true">' + OJO + '</svg>';
const ICO_OCULTO = '<svg viewBox="0 0 24 24" aria-hidden="true">' + OJO + '<line x1="4" y1="3" x2="20" y2="21" stroke="#fff" stroke-width="4.5"/><line x1="4" y1="3" x2="20" y2="21" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"/></svg>';
function verPw(ver) {
  $('pw').type = ver ? 'text' : 'password';
  $('ojo').innerHTML = ver ? ICO_VER : ICO_OCULTO; // ojo tachado = contraseña oculta
  $('ojo').title = $('ojo').ariaLabel = ver ? 'Ocultar contraseña' : 'Mostrar contraseña';
}
$('ojo').onclick = () => verPw($('pw').type === 'password');
verPw(false);
$('btnSalir').onclick = async () => { if (await confirmar('Cerrar sesión', '¿Quieres salir del panel?', 'Salir')) sb.auth.signOut(); };

function mostrar(sesion) {
  $('login').hidden = !!sesion; $('panel').hidden = !sesion; $('acc').hidden = !sesion;
  clearInterval(timer); if (canal) { sb.removeChannel(canal); canal = null; }
  if (!sesion) { datos = []; $('pw').value = ''; verPw(false); return; }
  cargar();
  timer = setInterval(() => cargar(true), 30000); // actualización cada 30 s
  canal = sb.channel('cambios-dispositivos')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'dispositivos' }, () => cargar(true))
    .subscribe();
}
if (!CONFIGURADO) { $('login').hidden = false; $('btnLogin').disabled = true; $('loginErr').textContent = 'Falta configurar SUPABASE_URL (debe empezar con https://) y SUPABASE_ANON_KEY en el código.'; $('loginErr').hidden = false; }
else {
  sb.auth.onAuthStateChange((_ev, s) => mostrar(s));
  sb.auth.getSession().then(({ data }) => { if (!data.session) mostrar(null); });
}
</script>
